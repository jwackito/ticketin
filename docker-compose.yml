services:
  migrate:
    build: ./backend
    command: alembic upgrade head
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://ticketin:ticketin@db:5432/ticketin}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/.venv

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://ticketin:ticketin@db:5432/ticketin}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-postgresql://ticketin:ticketin@db:5432/ticketin_test}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
      - /app/.venv
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      target: build
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ticketin
      POSTGRES_PASSWORD: ticketin
      POSTGRES_DB: ticketin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketin"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
